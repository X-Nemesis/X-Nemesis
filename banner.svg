<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="X-Nemesis: Prompts that break limits" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>X-Nemesis</title>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" y="3" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E11D2E" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="50%" r="55%">
      <stop offset="0" stop-color="#E11D2E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E11D2E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, "Courier New", monospace; }
      .ghost { animation: jitter 6s steps(1) infinite; }
      @keyframes jitter {
        0%, 92%, 100% { transform: translate(0, 0); }
        93% { transform: translate(-7px, 2px); }
        95% { transform: translate(6px, -2px); }
        97% { transform: translate(-3px, 0); }
      }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .ghost, .cursor { animation: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="300" fill="#0D0D0D"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>

  <!-- X mark -->
  <g transform="translate(150 150)">
    <g class="ghost" opacity="0.55">
      <path d="M-70 -80 L70 80 M70 -80 L-70 80" stroke="#7A0F19" stroke-width="30" stroke-linecap="butt" transform="translate(8 4)"/>
    </g>
    <path d="M-70 -80 L70 80 M70 -80 L-70 80" stroke="#E11D2E" stroke-width="26" stroke-linecap="butt"/>
    <!-- glitch slices -->
    <rect x="-90" y="-22" width="180" height="7" fill="#0D0D0D"/>
    <rect x="-90" y="30" width="180" height="4" fill="#0D0D0D"/>
    <rect x="-8" y="-22" width="70" height="7" fill="#E11D2E" opacity="0.9"/>
  </g>

  <!-- vertical divider -->
  <rect x="290" y="70" width="2" height="160" fill="#E11D2E" opacity="0.6"/>

  <!-- wordmark -->
  <text x="330" y="160" class="mono" font-size="92" font-weight="800" fill="#F2F2F2" letter-spacing="6">X-NEMESIS</text>
  <text x="334" y="208" class="mono" font-size="24" fill="#E11D2E" letter-spacing="3">&gt; prompts that break limits.<tspan class="cursor">_</tspan></text>
  <text x="334" y="244" class="mono" font-size="15" fill="#8A8A8A" letter-spacing="2">advanced AI prompts for developers</text>

  <!-- scanlines on top -->
  <rect width="1280" height="300" fill="url(#scan)"/>
  <!-- frame -->
  <rect x="0.5" y="0.5" width="1279" height="299" fill="none" stroke="#E11D2E" stroke-opacity="0.35"/>
</svg>
